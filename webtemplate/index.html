	<head>
		<meta charset="utf-8">

		<title>No Graphic Game</title>
		<link rel="icon" href="./favicon.ico">
		<link rel="icon" href="./favicon.png" type="image/png">
		<!-- 스타일은 인라인으로 포함합니다. 별도 css 요청이 늦게 도착하면 적용 전까지
		     캔버스가 원본 픽셀 크기로 크게 표시되어 첫 화면이 커졌다 줄어드는 문제가 생깁니다. -->
		<style>
			html, body {
				margin: 0;
				padding: 0;
